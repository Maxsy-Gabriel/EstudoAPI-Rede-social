<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Perfil — Lindos Social</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="guard.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <nav class="topnav">
    <span class="topnav-dot" aria-hidden="true"></span>
    <div class="topnav-links">
      <a href="/app">Feed</a>
      <a href="/app/admin" id="admin-link" class="hidden">Administração</a>
      <a href="/app/perfil" id="perfil-link" class="topnav-avatar" aria-label="Meu perfil"></a>
    </div>
  </nav>

  <div class="perfil-layout">
    <header class="perfil-header">
      <span id="avatar-preview" class="avatar avatar-grande"></span>

      <div class="perfil-info">
        <div class="perfil-info-top">
          <h1 id="perfil-username"></h1>
          <a href="/app/perfil/editar" id="editar-link" class="btn btn-ghost hidden">Editar perfil</a>
        </div>

        <p class="perfil-nome" id="perfil-nome"></p>
        <p class="perfil-stats"><strong id="perfil-total-posts">0</strong> publicações</p>

        <p class="perfil-sobre hidden" id="perfil-sobre-texto"></p>
        <p class="perfil-detalhes hidden" id="perfil-detalhes"></p>
      </div>
    </header>

    <hr class="perfil-divisor" />

    <ul id="perfil-posts" class="posts-list"></ul>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
