<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Feed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
  <script src="js/guard.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <nav class="topnav">
    <span class="topnav-dot" aria-hidden="true"></span>
    <div class="topnav-links">
      <a href="/app/admin" id="admin-link" class="hidden">Administração</a>
      <a href="/app/perfil" id="perfil-link" class="topnav-avatar" aria-label="Meu perfil"></a>
    </div>
  </nav>

  <div class="layout">
    <aside class="rail" id="pessoas" aria-labelledby="people-title">
      <h2 id="people-title">Pessoas</h2>

      <ul id="users-list" class="people-list"></ul>
    </aside>

    <main class="feed" id="feed" aria-labelledby="feed-title">
      <h2 id="feed-title" class="sr-only">Feed</h2>

      <form id="posts-form" class="composer">
        <div class="composer-row">
          <span id="composer-avatar" class="avatar" aria-hidden="true"></span>
          <input id="post-text" type="text" placeholder="O que você está pensando?" />
          <button type="button" id="post-image-btn" class="composer-image-btn" aria-label="Adicionar imagem" title="Adicionar imagem">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="2.5" y="4" width="15" height="12" rx="2.5" />
              <circle cx="7" cy="8.5" r="1.3" fill="currentColor" stroke="none" />
              <path d="M4 14.5 8 10.5 11 13 14 10 16.5 12.5" />
            </svg>
          </button>
          <input type="file" id="post-image-input" accept="image/*" class="hidden" />
          <button type="button" id="post-video-btn" class="composer-image-btn" aria-label="Adicionar vídeo" title="Adicionar vídeo (máx. 30s)">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="2.5" y="3.5" width="15" height="13" rx="2.5" />
              <path d="M8.5 7.3 13 10l-4.5 2.7V7.3Z" fill="currentColor" stroke="none" />
            </svg>
          </button>
          <input type="file" id="post-video-input" accept="video/*" class="hidden" />
          <button type="submit">Postar</button>
        </div>

        <div id="post-image-preview" class="composer-image-preview hidden">
          <img id="post-image-preview-img" src="" alt="" />
          <button type="button" id="post-image-remove-btn" class="composer-image-remove" aria-label="Remover imagem">×</button>
        </div>

        <div id="post-video-preview" class="composer-image-preview hidden">
          <video id="post-video-preview-el" muted playsinline controls></video>
          <button type="button" id="post-video-remove-btn" class="composer-image-remove" aria-label="Remover vídeo">×</button>
        </div>
      </form>

      <ul id="posts-list" class="posts-list"></ul>
    </main>

    <aside class="rail" aria-labelledby="identity-title">
      <h2 id="identity-title">Você é</h2>
      <div id="identity-card"></div>
      <button id="logout-btn" type="button" class="logout-btn">Sair</button>
    </aside>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
